<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Main foliage -->
  <ellipse cx="32" cy="20" rx="16" ry="12" fill="#4CAF50"/>
  <ellipse cx="26" cy="16" rx="8" ry="6" fill="#388E3C"/>
  <ellipse cx="38" cy="16" rx="8" ry="6" fill="#388E3C"/>
  <!-- Stem -->
  <line x1="32" y1="32" x2="32" y2="58" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
  <!-- Aubergine - dark purple oval -->
  <ellipse cx="30" cy="42" rx="8" ry="12" fill="#4A148C"/>
  <ellipse cx="30" cy="42" rx="8" ry="12" fill="none" stroke="#311B92" stroke-width="0.7"/>
  <!-- Highlight -->
  <ellipse cx="27" cy="38" rx="2" ry="5" fill="#6A1B9A" opacity="0.5"/>
  <!-- Calyx (green top) -->
  <path d="M24 30 Q30 28 36 30 Q34 32 30 32 Q26 32 24 30 Z" fill="#2E7D32"/>
  <path d="M30 30 L30 27" stroke="#388E3C" stroke-width="2" stroke-linecap="round"/>
  <!-- Leaves -->
  <ellipse cx="20" cy="26" rx="5" ry="3" fill="#66BB6A" transform="rotate(-20 20 26)"/>
  <ellipse cx="44" cy="26" rx="5" ry="3" fill="#66BB6A" transform="rotate(20 44 26)"/>
  <!-- Top leaves -->
  <ellipse cx="28" cy="10" rx="6" ry="3" fill="#66BB6A" transform="rotate(-8 28 10)"/>
  <ellipse cx="36" cy="10" rx="6" ry="3" fill="#66BB6A" transform="rotate(8 36 10)"/>
</svg>
