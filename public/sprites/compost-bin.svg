<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 104">
  <!-- Left wall (SW) - wooden slats - depth 14 -->
  <polygon points="4,34 64,64 64,78 4,48" fill="#6B5D3F"/>
  <line x1="4" y1="39" x2="64" y2="69" stroke="#3D3D1F" stroke-width="2.5" opacity="0.7"/>
  <line x1="4" y1="48" x2="64" y2="78" stroke="#3D3D1F" stroke-width="2.5" opacity="0.7"/>
  <line x1="4" y1="57" x2="64" y2="87" stroke="#3D3D1F" stroke-width="2" opacity="0.6"/>
  <!-- Right wall (SE) - darker slats -->
  <polygon points="64,64 124,34 124,48 64,78" fill="#4A3F28"/>
  <line x1="64" y1="69" x2="124" y2="39" stroke="#2D2D14" stroke-width="2.5" opacity="0.7"/>
  <line x1="64" y1="78" x2="124" y2="48" stroke="#2D2D14" stroke-width="2.5" opacity="0.7"/>
  <!-- Top face - dark compost inside -->
  <polygon points="64,4 124,34 64,64 4,34" fill="#1A0F00"/>
  <!-- Compost texture -->
  <ellipse cx="44" cy="32" rx="8" ry="4" fill="#2C1A0A" opacity="0.6" transform="rotate(-25 44 32)"/>
  <ellipse cx="78" cy="28" rx="7" ry="3" fill="#2C1A0A" opacity="0.6" transform="rotate(-25 78 28)"/>
  <ellipse cx="64" cy="48" rx="8" ry="3" fill="#2C1A0A" opacity="0.5" transform="rotate(-25 64 48)"/>
  <!-- Rim/edge highlight -->
  <polyline points="4,34 64,4 124,34" stroke="#8B7355" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small compost bits -->
  <circle cx="35" cy="38" r="1" fill="#3D2410" opacity="0.7"/>
  <circle cx="92" cy="32" r="1.2" fill="#3D2410" opacity="0.7"/>
  <circle cx="60" cy="55" r="0.8" fill="#3D2410" opacity="0.6"/>
</svg>
