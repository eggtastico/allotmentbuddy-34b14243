<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Top-down view of a hanging basket -->

  <!-- Wicker outer circle -->
  <circle cx="30" cy="30" r="29" fill="#B8923C"/>

  <!-- Wicker body -->
  <circle cx="30" cy="30" r="26" fill="#C8A055"/>

  <!-- Wicker rings (decorative) -->
  <circle cx="30" cy="30" r="22" fill="none" stroke="#9A7830" stroke-width="2" opacity="0.5"/>
  <circle cx="30" cy="30" r="17" fill="none" stroke="#9A7830" stroke-width="2" opacity="0.5"/>

  <!-- Outer ring border -->
  <circle cx="30" cy="30" r="29" fill="none" stroke="#7A5820" stroke-width="2"/>

  <!-- Plant fill -->
  <circle cx="30" cy="30" r="16" fill="#2E4018"/>

  <!-- Plant dots -->
  <circle cx="26" cy="27" r="3.5" fill="#5A8030" opacity="0.9"/>
  <circle cx="35" cy="30" r="3" fill="#5A8030" opacity="0.9"/>
  <circle cx="29" cy="36" r="3.5" fill="#5A8030" opacity="0.9"/>

  <!-- Flower dots -->
  <circle cx="25" cy="33" r="2.5" fill="#E88820" opacity="0.8"/>
  <circle cx="35" cy="24" r="2" fill="#F09030" opacity="0.8"/>
</svg>
