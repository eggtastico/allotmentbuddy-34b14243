  <ellipse cx="32" cy="24" rx="24" ry="14" fill="#4CAF50"/>
  <ellipse cx="20" cy="20" rx="10" ry="7" fill="#388E3C"/>
  <ellipse cx="44" cy="20" rx="10" ry="7" fill="#388E3C"/>
  <ellipse cx="32" cy="16" rx="12" ry="8" fill="#66BB6A"/>
  <!-- Large leaves -->
  <ellipse cx="12" cy="28" rx="8" ry="5" fill="#2E7D32" transform="rotate(-25 12 28)"/>
  <ellipse cx="52" cy="28" rx="8" ry="5" fill="#2E7D32" transform="rotate(25 52 28)"/>
