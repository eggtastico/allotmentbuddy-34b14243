<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <!-- Top-down fruit tree canopy -->

  <!-- Shadow -->
  <circle cx="47" cy="47" r="40" fill="#3A5020" opacity="0.25"/>

  <!-- Main canopy -->
  <circle cx="45" cy="45" r="40" fill="#5A8030"/>

  <!-- Leaf clusters (6 overlapping circles) -->
  <circle cx="35" cy="30" r="14" fill="#6A9838"/>
  <circle cx="55" cy="28" r="12" fill="#649235"/>
  <circle cx="62" cy="48" r="13" fill="#6A9838"/>
  <circle cx="50" cy="62" r="12" fill="#5E8C32"/>
  <circle cx="30" cy="58" r="13" fill="#64902E"/>
  <circle cx="42" cy="42" r="10" fill="#70A040" opacity="0.7"/>

  <!-- Fruit dots (red) -->
  <circle cx="28" cy="36" r="4" fill="#C83020"/>
  <circle cx="50" cy="32" r="3.5" fill="#C83020"/>
  <circle cx="62" cy="52" r="4" fill="#C83020"/>
  <circle cx="38" cy="60" r="3.5" fill="#C83020"/>
  <circle cx="54" cy="56" r="3" fill="#C83020"/>

  <!-- Canopy center shadow -->
  <circle cx="45" cy="45" r="15" fill="#4A7028" opacity="0.3"/>
</svg>
