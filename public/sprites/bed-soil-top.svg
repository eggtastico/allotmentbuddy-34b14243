<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Tileable top-down view of rich garden soil -->

  <!-- Dark rich soil background -->
  <rect width="48" height="48" fill="#3A2A1A"/>

  <!-- Moisture variation - darker patches -->
  <ellipse cx="10" cy="8" rx="6" ry="4" fill="#2E2015" opacity="0.5"/>
  <ellipse cx="38" cy="30" rx="7" ry="5" fill="#2E2015" opacity="0.4"/>
  <ellipse cx="20" cy="38" rx="5" ry="4" fill="#2E2015" opacity="0.45"/>

  <!-- Crumbly soil lumps - irregular shapes using paths -->
  <path d="M6 12c1-1 3-1 4 0s1 2 0 3-3 1-4 0-1-2 0-3z" fill="#5C4030" opacity="0.7"/>
  <path d="M22 6c1.5-0.5 3 0 3.5 1s0 2.5-1.5 3-3-0.5-3.5-1.5 0.5-2 1.5-2.5z" fill="#4D3525" opacity="0.6"/>
  <path d="M35 10c1-0.8 2.5-0.5 3 0.5s0 2.2-1 3-2.5 0.5-3-0.5 0-2.2 1-3z" fill="#5C4030" opacity="0.65"/>
  <path d="M14 22c1.2-0.5 2.8 0 3.2 1.2s-0.3 2.5-1.5 3-2.8-0.2-3.2-1.4 0.3-2.3 1.5-2.8z" fill="#5C4030" opacity="0.6"/>
  <path d="M40 20c0.8-0.6 2-0.3 2.5 0.5s0.1 1.8-0.7 2.3-2 0.3-2.5-0.5-0.1-1.7 0.7-2.3z" fill="#4D3525" opacity="0.65"/>
  <path d="M28 28c1.3-0.4 2.5 0.3 2.8 1.5s-0.5 2.3-1.8 2.7-2.5-0.5-2.8-1.7 0.5-2.1 1.8-2.5z" fill="#5C4030" opacity="0.7"/>
  <path d="M4 34c1-0.5 2.2 0 2.5 1s-0.2 2-1.2 2.5-2.2-0.1-2.5-1.1 0.2-1.9 1.2-2.4z" fill="#5C4030" opacity="0.6"/>
  <path d="M44 38c0.8-0.7 2-0.4 2.6 0.4s0.2 1.8-0.6 2.4-2 0.4-2.6-0.4-0.2-1.7 0.6-2.4z" fill="#4D3525" opacity="0.6"/>
  <path d="M18 44c1.2-0.3 2.3 0.4 2.5 1.5s-0.6 2-1.8 2.3-2.3-0.5-2.5-1.6 0.6-1.9 1.8-2.2z" fill="#5C4030" opacity="0.65"/>
  <path d="M34 44c0.9-0.5 2.1-0.1 2.5 0.8s0 2-0.9 2.5-2.1 0.1-2.5-0.8 0-2 0.9-2.5z" fill="#5C4030" opacity="0.55"/>

  <!-- Smaller soil particles / pebbles -->
  <circle cx="12" cy="4" r="1.3" fill="#7A6050" opacity="0.6"/>
  <circle cx="30" cy="14" r="1.1" fill="#7A6050" opacity="0.55"/>
  <circle cx="46" cy="6" r="1" fill="#6B5545" opacity="0.5"/>
  <circle cx="8" cy="26" r="1.2" fill="#7A6050" opacity="0.55"/>
  <circle cx="36" cy="24" r="0.9" fill="#6B5545" opacity="0.5"/>
  <circle cx="24" cy="34" r="1.1" fill="#7A6050" opacity="0.6"/>
  <circle cx="44" cy="44" r="1" fill="#6B5545" opacity="0.5"/>
  <circle cx="2" cy="46" r="1.2" fill="#7A6050" opacity="0.55"/>

  <!-- Tiny lighter specks throughout -->
  <circle cx="5" cy="3" r="0.5" fill="#7A6050" opacity="0.7"/>
  <circle cx="16" cy="10" r="0.4" fill="#8A7060" opacity="0.5"/>
  <circle cx="38" cy="4" r="0.5" fill="#7A6050" opacity="0.6"/>
  <circle cx="26" cy="16" r="0.4" fill="#8A7060" opacity="0.55"/>
  <circle cx="42" cy="14" r="0.5" fill="#7A6050" opacity="0.5"/>
  <circle cx="10" cy="18" r="0.4" fill="#8A7060" opacity="0.6"/>
  <circle cx="32" cy="38" r="0.5" fill="#7A6050" opacity="0.55"/>
  <circle cx="14" cy="42" r="0.4" fill="#8A7060" opacity="0.5"/>
  <circle cx="46" cy="28" r="0.4" fill="#7A6050" opacity="0.6"/>
  <circle cx="20" cy="30" r="0.5" fill="#8A7060" opacity="0.55"/>
  <circle cx="40" cy="46" r="0.4" fill="#7A6050" opacity="0.5"/>
  <circle cx="2" cy="14" r="0.5" fill="#8A7060" opacity="0.55"/>

  <!-- Organic matter - small stick-like lines -->
  <line x1="15" y1="7" x2="18" y2="8" stroke="#4D3525" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
  <line x1="33" y1="18" x2="36" y2="17" stroke="#4D3525" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>
  <line x1="8" y1="32" x2="10" y2="34" stroke="#4D3525" stroke-width="0.7" stroke-linecap="round" opacity="0.65"/>
  <line x1="42" y1="34" x2="44" y2="36" stroke="#4D3525" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>
  <line x1="26" y1="42" x2="28" y2="44" stroke="#4D3525" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>

  <!-- Organic matter - tiny leaf fragment shapes -->
  <path d="M20 20c0.5-1 1.5-1 2 0s-0.5 1.5-1 1.5-1.5-0.5-1-1.5z" fill="#3D5020" opacity="0.35"/>
  <path d="M38 40c0.4-0.8 1.2-0.8 1.6 0s-0.4 1.2-0.8 1.2-1.2-0.4-0.8-1.2z" fill="#4A5520" opacity="0.3"/>
  <path d="M6 44c0.3-0.6 1-0.7 1.3 0s-0.3 1-0.7 1-1-0.4-0.6-1z" fill="#3D5020" opacity="0.3"/>

  <!-- Worm holes - tiny dark circles -->
  <circle cx="22" cy="12" r="0.8" fill="#1A1008" opacity="0.8"/>
  <circle cx="36" cy="42" r="0.7" fill="#1A1008" opacity="0.75"/>
  <circle cx="8" cy="38" r="0.6" fill="#1A1008" opacity="0.7"/>

  <!-- Seamless tiling wrap elements (matching elements near edges) -->
  <path d="M47 22c0.8-0.6 1.5-0.3 1.5 0.5" fill="none" stroke="#5C4030" stroke-width="0.5" opacity="0.4"/>
  <path d="M0 22c-0.3 0.8 0.2 1.5 0.8 1.5" fill="none" stroke="#5C4030" stroke-width="0.5" opacity="0.4"/>
</svg>
