<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
  <!-- Top-down paving slab tile — 2×2 grid, tiles seamlessly -->
  <!-- Sand/mortar base -->
  <rect width="48" height="48" fill="#A09070"/>

  <!-- Slab 1: top-left — warm buff -->
  <rect x="2" y="2" width="20" height="20" rx="2" fill="#D4C4A0"/>
  <!-- top-edge highlight -->
  <rect x="3" y="3" width="18" height="3" rx="1" fill="#E2D4BA" opacity="0.7"/>
  <!-- right-edge shadow -->
  <rect x="19" y="5" width="2" height="14" rx="1" fill="#8A7A58" opacity="0.25"/>

  <!-- Slab 2: top-right — slightly cooler -->
  <rect x="26" y="2" width="20" height="20" rx="2" fill="#CCBA96"/>
  <rect x="27" y="3" width="18" height="3" rx="1" fill="#DAC8AE" opacity="0.7"/>
  <rect x="43" y="5" width="2" height="14" rx="1" fill="#86765A" opacity="0.25"/>

  <!-- Slab 3: bottom-left — warm -->
  <rect x="2" y="26" width="20" height="20" rx="2" fill="#D0BEA0"/>
  <rect x="3" y="27" width="18" height="3" rx="1" fill="#DECEBB" opacity="0.7"/>
  <rect x="19" y="29" width="2" height="14" rx="1" fill="#887860" opacity="0.25"/>

  <!-- Slab 4: bottom-right — neutral warm -->
  <rect x="26" y="26" width="20" height="20" rx="2" fill="#D2C2A2"/>
  <rect x="27" y="27" width="18" height="3" rx="1" fill="#DECDB8" opacity="0.7"/>
  <rect x="43" y="29" width="2" height="14" rx="1" fill="#8A7A5C" opacity="0.25"/>
</svg>
