<svg xmlns="http://www.w3.org/2000/svg" width="90" height="30" viewBox="0 0 90 30">
  <!-- Top-down view of a grow bag -->

  <!-- Black polythene bag -->
  <rect width="90" height="30" rx="3" fill="#1A1A1A"/>

  <!-- Bag texture lines -->
  <line x1="0" y1="10" x2="90" y2="10" stroke="#2A2A2A" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="20" x2="90" y2="20" stroke="#2A2A2A" stroke-width="1" opacity="0.5"/>

  <!-- Growing slits (X-cuts) — filled -->
  <ellipse cx="15" cy="15" rx="8" ry="5" fill="#3A2010"/>
  <ellipse cx="45" cy="15" rx="8" ry="5" fill="#3A2010"/>
  <ellipse cx="75" cy="15" rx="8" ry="5" fill="#3A2010"/>

  <!-- Slit outlines -->
  <ellipse cx="15" cy="15" rx="8" ry="5" fill="none" stroke="#0A0A0A" stroke-width="1"/>
  <ellipse cx="45" cy="15" rx="8" ry="5" fill="none" stroke="#0A0A0A" stroke-width="1"/>
  <ellipse cx="75" cy="15" rx="8" ry="5" fill="none" stroke="#0A0A0A" stroke-width="1"/>
</svg>
