<svg xmlns="http://www.w3.org/2000/svg" width="120" height="90" viewBox="0 0 120 90">
  <!-- Top-down view of a gabled shed roof -->

  <!-- Upper slope (y 0-42): lighter green-grey corrugated metal -->
  <rect x="0" y="0" width="120" height="42" fill="#5E7055"/>

  <!-- Ridge line strip (y 42-48): very dark -->
  <rect x="0" y="42" width="120" height="6" fill="#2A3820"/>

  <!-- Lower slope (y 48-90): darker shadow slope -->
  <rect x="0" y="48" width="120" height="42" fill="#3E5038"/>

  <!-- Horizontal corrugation lines on upper slope -->
  <line x1="0" y1="10" x2="120" y2="10" stroke="#4A6040" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="20" x2="120" y2="20" stroke="#4A6040" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="30" x2="120" y2="30" stroke="#4A6040" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="38" x2="120" y2="38" stroke="#4A6040" stroke-width="1" opacity="0.5"/>

  <!-- Horizontal corrugation lines on lower slope -->
  <line x1="0" y1="58" x2="120" y2="58" stroke="#3A4A30" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="68" x2="120" y2="68" stroke="#3A4A30" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="78" x2="120" y2="78" stroke="#3A4A30" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="86" x2="120" y2="86" stroke="#3A4A30" stroke-width="1" opacity="0.5"/>

  <!-- Ridge highlight -->
  <line x1="0" y1="43" x2="120" y2="43" stroke="#6A8060" stroke-width="1" opacity="0.3"/>
</svg>
