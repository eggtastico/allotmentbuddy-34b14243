<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Top-down woodchip/bark mulch path — 48x48 seamless tile -->
  <!-- Dark soil/shadow base visible between chips -->
  <rect width="48" height="48" fill="#2E1A0A"/>

  <!-- Shadow/gap layer for depth -->
  <rect x="0" y="0" width="48" height="48" fill="#1A0E04" opacity="0.3"/>

  <!-- Layer 1: Bottom chips (partially hidden) -->
  <ellipse cx="4" cy="3" rx="3.5" ry="1.5" transform="rotate(25 4 3)" fill="#5C4025"/>
  <ellipse cx="20" cy="2" rx="4" ry="1.8" transform="rotate(-15 20 2)" fill="#8B6B42"/>
  <ellipse cx="38" cy="4" rx="3" ry="1.5" transform="rotate(40 38 4)" fill="#7A4030"/>
  <ellipse cx="12" cy="10" rx="3.5" ry="1.5" transform="rotate(-30 12 10)" fill="#B8956A"/>
  <ellipse cx="30" cy="8" rx="4" ry="1.8" transform="rotate(12 30 8)" fill="#5C4025"/>
  <ellipse cx="45" cy="11" rx="3" ry="1.3" transform="rotate(-45 45 11)" fill="#8B6B42"/>
  <ellipse cx="2" cy="16" rx="3.5" ry="1.5" transform="rotate(55 2 16)" fill="#7A4030"/>
  <ellipse cx="22" cy="15" rx="4" ry="1.8" transform="rotate(-8 22 15)" fill="#B8956A"/>
  <ellipse cx="40" cy="18" rx="3.5" ry="1.5" transform="rotate(30 40 18)" fill="#5C4025"/>

  <!-- Layer 2: Middle chips -->
  <ellipse cx="8" cy="6" rx="3.8" ry="1.6" transform="rotate(-20 8 6)" fill="#8B6B42"/>
  <ellipse cx="26" cy="5" rx="3" ry="1.4" transform="rotate(35 26 5)" fill="#B8956A"/>
  <ellipse cx="44" cy="7" rx="3.5" ry="1.5" transform="rotate(-50 44 7)" fill="#5C4025"/>
  <ellipse cx="15" cy="13" rx="4" ry="1.7" transform="rotate(42 15 13)" fill="#7A4030"/>
  <ellipse cx="35" cy="12" rx="3.2" ry="1.4" transform="rotate(-25 35 12)" fill="#B8956A"/>
  <ellipse cx="6" cy="20" rx="3.5" ry="1.5" transform="rotate(15 6 20)" fill="#8B6B42"/>
  <ellipse cx="25" cy="19" rx="3.8" ry="1.6" transform="rotate(-38 25 19)" fill="#5C4025"/>
  <ellipse cx="46" cy="21" rx="3" ry="1.3" transform="rotate(48 46 21)" fill="#7A4030"/>

  <!-- Layer 3: More coverage -->
  <ellipse cx="10" cy="24" rx="3.5" ry="1.5" transform="rotate(-10 10 24)" fill="#B8956A"/>
  <ellipse cx="28" cy="23" rx="4" ry="1.7" transform="rotate(28 28 23)" fill="#8B6B42"/>
  <ellipse cx="42" cy="25" rx="3.2" ry="1.4" transform="rotate(-55 42 25)" fill="#5C4025"/>
  <ellipse cx="3" cy="30" rx="3.5" ry="1.5" transform="rotate(38 3 30)" fill="#7A4030"/>
  <ellipse cx="18" cy="28" rx="3.8" ry="1.6" transform="rotate(-18 18 28)" fill="#B8956A"/>
  <ellipse cx="36" cy="30" rx="3" ry="1.4" transform="rotate(22 36 30)" fill="#8B6B42"/>
  <ellipse cx="48" cy="32" rx="3.5" ry="1.5" transform="rotate(-42 48 32)" fill="#5C4025"/>
  <ellipse cx="13" cy="34" rx="4" ry="1.7" transform="rotate(50 13 34)" fill="#7A4030"/>
  <ellipse cx="30" cy="33" rx="3.5" ry="1.5" transform="rotate(-5 30 33)" fill="#B8956A"/>

  <!-- Layer 4: Upper chips -->
  <ellipse cx="7" cy="37" rx="3.2" ry="1.4" transform="rotate(-32 7 37)" fill="#8B6B42"/>
  <ellipse cx="24" cy="36" rx="3.8" ry="1.6" transform="rotate(45 24 36)" fill="#5C4025"/>
  <ellipse cx="40" cy="38" rx="3.5" ry="1.5" transform="rotate(-15 40 38)" fill="#B8956A"/>
  <ellipse cx="2" cy="42" rx="3" ry="1.4" transform="rotate(20 2 42)" fill="#7A4030"/>
  <ellipse cx="16" cy="41" rx="4" ry="1.7" transform="rotate(-48 16 41)" fill="#8B6B42"/>
  <ellipse cx="34" cy="42" rx="3.5" ry="1.5" transform="rotate(32 34 42)" fill="#5C4025"/>
  <ellipse cx="46" cy="44" rx="3.2" ry="1.4" transform="rotate(-22 46 44)" fill="#B8956A"/>
  <ellipse cx="10" cy="47" rx="3.5" ry="1.5" transform="rotate(15 10 47)" fill="#7A4030"/>
  <ellipse cx="28" cy="46" rx="3.8" ry="1.6" transform="rotate(-35 28 46)" fill="#8B6B42"/>
  <ellipse cx="44" cy="48" rx="3" ry="1.3" transform="rotate(55 44 48)" fill="#5C4025"/>

  <!-- Tiling wrap: chips that cross edges -->
  <ellipse cx="0" cy="8" rx="3.5" ry="1.5" transform="rotate(-20 0 8)" fill="#B8956A"/>
  <ellipse cx="48" cy="8" rx="3.5" ry="1.5" transform="rotate(-20 48 8)" fill="#B8956A"/>
  <ellipse cx="0" cy="42" rx="3" ry="1.4" transform="rotate(20 0 42)" fill="#7A4030"/>
  <ellipse cx="10" cy="0" rx="3.5" ry="1.5" transform="rotate(25 10 0)" fill="#8B6B42"/>
  <ellipse cx="10" cy="48" rx="3.5" ry="1.5" transform="rotate(25 10 48)" fill="#8B6B42"/>
  <ellipse cx="34" cy="0" rx="3" ry="1.4" transform="rotate(-10 34 0)" fill="#5C4025"/>
  <ellipse cx="34" cy="48" rx="3" ry="1.4" transform="rotate(-10 34 48)" fill="#5C4025"/>

  <!-- Top layer highlights on some chips -->
  <ellipse cx="12" cy="10" rx="3" ry="1.2" transform="rotate(-30 12 10)" fill="#D4AD7A" opacity="0.2"/>
  <ellipse cx="28" cy="23" rx="3.5" ry="1.4" transform="rotate(28 28 23)" fill="#D4AD7A" opacity="0.15"/>
  <ellipse cx="18" cy="28" rx="3.2" ry="1.3" transform="rotate(-18 18 28)" fill="#D4AD7A" opacity="0.18"/>
  <ellipse cx="40" cy="38" rx="3" ry="1.2" transform="rotate(-15 40 38)" fill="#D4AD7A" opacity="0.15"/>
  <ellipse cx="24" cy="36" rx="3.2" ry="1.3" transform="rotate(45 24 36)" fill="#D4AD7A" opacity="0.12"/>
</svg>
