<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 202">
  <!-- GREENHOUSE: 6x4, depth=42. Diamond: top=(160,0) R=(320,80) B=(160,160) L=(0,80) -->

  <!-- Left wall (SW) - glass panels -->
  <polygon points="0,80 160,160 160,202 0,122" fill="#8ABFD8" opacity="0.55"/>
  <line x1="40" y1="100" x2="40" y2="132" stroke="#90A4AE" stroke-width="2"/>
  <line x1="80" y1="120" x2="80" y2="152" stroke="#90A4AE" stroke-width="2"/>
  <line x1="120" y1="140" x2="120" y2="172" stroke="#90A4AE" stroke-width="2"/>
  <line x1="0" y1="101" x2="160" y2="181" stroke="#90A4AE" stroke-width="1.5" opacity="0.6"/>

  <!-- Right wall (SE) - darker glass -->
  <polygon points="160,160 320,80 320,122 160,202" fill="#78A8C0" opacity="0.55"/>
  <line x1="200" y1="140" x2="200" y2="172" stroke="#78909C" stroke-width="2"/>
  <line x1="240" y1="120" x2="240" y2="152" stroke="#78909C" stroke-width="2"/>
  <line x1="280" y1="100" x2="280" y2="132" stroke="#78909C" stroke-width="2"/>
  <line x1="160" y1="181" x2="320" y2="101" stroke="#78909C" stroke-width="1.5" opacity="0.6"/>

  <!-- Top face - glass roof -->
  <polygon points="160,0 320,80 160,160 0,80" fill="#B0D4E8" opacity="0.45"/>

  <!-- Ridge line -->
  <line x1="160" y1="0" x2="160" y2="160" stroke="#B0B8C0" stroke-width="2.5" opacity="0.5"/>

  <!-- Roof frame grid -->
  <line x1="80" y1="40" x2="240" y2="120" stroke="#90A4AE" stroke-width="1.5" opacity="0.4"/>
  <line x1="80" y1="120" x2="240" y2="40" stroke="#90A4AE" stroke-width="1.5" opacity="0.4"/>

  <!-- Green plants visible inside -->
  <ellipse cx="120" cy="90" rx="30" ry="12" fill="#4CAF50" opacity="0.18"/>
  <ellipse cx="200" cy="85" rx="25" ry="10" fill="#388E3C" opacity="0.15"/>

  <!-- Frame highlight top -->
  <polyline points="0,80 160,0 320,80" stroke="#CFD8DC" stroke-width="2.5" fill="none"/>
  <polyline points="0,122 160,202 320,122" stroke="#607D8B" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Door -->
  <polygon points="150,160 170,160 170,192 150,192" fill="#90A4AE" opacity="0.6"/>
  <circle cx="166" cy="176" r="1.5" fill="#546E7A"/>
</svg>
