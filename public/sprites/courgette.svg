<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Low bushy plant -->
  <ellipse cx="32" cy="30" rx="22" ry="14" fill="#4CAF50"/>
  <ellipse cx="22" cy="26" rx="10" ry="8" fill="#388E3C"/>
  <ellipse cx="42" cy="26" rx="10" ry="8" fill="#388E3C"/>
  <ellipse cx="32" cy="22" rx="12" ry="8" fill="#66BB6A"/>
  <!-- Large star-shaped leaves -->
  <ellipse cx="16" cy="30" rx="8" ry="5" fill="#2E7D32" transform="rotate(-30 16 30)"/>
  <ellipse cx="48" cy="30" rx="8" ry="5" fill="#2E7D32" transform="rotate(30 48 30)"/>
  <!-- Courgette - green cylinder lying on ground -->
  <rect x="18" y="44" width="28" height="8" rx="4" fill="#558B2F"/>
  <rect x="18" y="44" width="28" height="8" rx="4" fill="none" stroke="#33691E" stroke-width="0.5"/>
  <!-- Stripes -->
  <line x1="22" y1="44" x2="22" y2="52" stroke="#689F38" stroke-width="0.5" opacity="0.5"/>
  <line x1="28" y1="44" x2="28" y2="52" stroke="#689F38" stroke-width="0.5" opacity="0.5"/>
  <line x1="34" y1="44" x2="34" y2="52" stroke="#689F38" stroke-width="0.5" opacity="0.5"/>
  <line x1="40" y1="44" x2="40" y2="52" stroke="#689F38" stroke-width="0.5" opacity="0.5"/>
  <!-- Yellow flower -->
  <circle cx="48" cy="44" r="3" fill="#FDD835"/>
  <circle cx="48" cy="44" r="1.5" fill="#F9A825"/>
</svg>
