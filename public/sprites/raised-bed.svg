<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 106">
  <!-- RAISED BED: 4x2, depth=10. Diamond: top=(96,0) R=(192,48) B=(96,96) L=(0,48) -->

  <!-- Left wall (SW) - wood planks -->
  <polygon points="0,48 96,96 96,106 0,58" fill="#7A5230"/>
  <line x1="0" y1="51" x2="96" y2="99" stroke="#5E3D22" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="55" x2="96" y2="103" stroke="#5E3D22" stroke-width="1.5" opacity="0.5"/>

  <!-- Right wall (SE) - darker wood -->
  <polygon points="96,96 192,48 192,58 96,106" fill="#5C3B1A"/>
  <line x1="96" y1="99" x2="192" y2="51" stroke="#3F2510" stroke-width="1.5" opacity="0.5"/>
  <line x1="96" y1="103" x2="192" y2="55" stroke="#3F2510" stroke-width="1.5" opacity="0.5"/>

  <!-- Top face - dark soil -->
  <polygon points="96,0 192,48 96,96 0,48" fill="#2C1A0E"/>

  <!-- Soil furrows -->
  <line x1="32" y1="32" x2="128" y2="80" stroke="#1A0F06" stroke-width="2" opacity="0.4"/>
  <line x1="64" y1="16" x2="160" y2="64" stroke="#1A0F06" stroke-width="2" opacity="0.4"/>
  <line x1="96" y1="32" x2="144" y2="56" stroke="#1A0F06" stroke-width="1.5" opacity="0.3"/>

  <!-- Soil texture lumps -->
  <ellipse cx="60" cy="38" rx="5" ry="2" fill="#3D2B1A" opacity="0.5"/>
  <ellipse cx="96" cy="50" rx="6" ry="2.5" fill="#3D2B1A" opacity="0.4"/>
  <ellipse cx="130" cy="56" rx="5" ry="2" fill="#3D2B1A" opacity="0.5"/>
  <ellipse cx="80" cy="60" rx="4" ry="1.5" fill="#3D2B1A" opacity="0.4"/>

  <!-- Top rim highlight -->
  <polyline points="0,48 96,0 192,48" stroke="#A07A50" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Bottom rim -->
  <polyline points="0,58 96,106 192,58" stroke="#4A2E14" stroke-width="1" fill="none" opacity="0.6"/>
</svg>
