<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Fruit cage netting - top-down view, tileable 48x48 -->

  <!-- Very transparent background to show plants beneath -->
  <rect width="48" height="48" fill="rgba(80, 90, 80, 0.08)"/>

  <!-- Shadow layer for netting (offset 0.5px down-right, very faint) -->
  <g opacity="0.15" transform="translate(0.5, 0.5)">
    <!-- Diamond mesh shadows - diagonal lines going top-left to bottom-right -->
    <path d="M0,0 Q4,4.5 8,8" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M8,0 Q12,4.5 16,8" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M16,0 Q20,4.5 24,8" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M24,0 Q28,4.5 32,8" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M32,0 Q36,4.5 40,8" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M40,0 Q44,4.5 48,8" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M0,8 Q4,12.5 8,16" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M8,8 Q12,12.5 16,16" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M16,8 Q20,12.5 24,16" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M24,8 Q28,12.5 32,16" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M32,8 Q36,12.5 40,16" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M40,8 Q44,12.5 48,16" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M0,16 Q4,20.5 8,24" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M8,16 Q12,20.5 16,24" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M16,16 Q20,20.5 24,24" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M24,16 Q28,20.5 32,24" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M32,16 Q36,20.5 40,24" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M40,16 Q44,20.5 48,24" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M0,24 Q4,28.5 8,32" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M8,24 Q12,28.5 16,32" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M16,24 Q20,28.5 24,32" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M24,24 Q28,28.5 32,32" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M32,24 Q36,28.5 40,32" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M40,24 Q44,28.5 48,32" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M0,32 Q4,36.5 8,40" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M8,32 Q12,36.5 16,40" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M16,32 Q20,36.5 24,40" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M24,32 Q28,36.5 32,40" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M32,32 Q36,36.5 40,40" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M40,32 Q44,36.5 48,40" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M0,40 Q4,44.5 8,48" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M8,40 Q12,44.5 16,48" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M16,40 Q20,44.5 24,48" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
    <path d="M24,40 Q28,44.5 32,48" stroke="#2a2f2a" stroke-width="0.6" fill="none"/>
