<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 158">
  <!-- SHED: 4x3, depth=46. Diamond: top=(112,0) R=(224,56) B=(112,112) L=(0,56) -->

  <!-- Left wall (SW) - wood planks -->
  <polygon points="0,56 112,112 112,158 0,102" fill="#8B5A2B"/>
  <line x1="0" y1="62" x2="112" y2="118" stroke="#6B3E1F" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="70" x2="112" y2="126" stroke="#6B3E1F" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="78" x2="112" y2="134" stroke="#6B3E1F" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="86" x2="112" y2="142" stroke="#6B3E1F" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="94" x2="112" y2="150" stroke="#6B3E1F" stroke-width="1.5" opacity="0.5"/>

  <!-- Right wall (SE) - darker wood -->
  <polygon points="112,112 224,56 224,102 112,158" fill="#6B3E1F"/>
  <line x1="112" y1="118" x2="224" y2="62" stroke="#4A2415" stroke-width="1.5" opacity="0.5"/>
  <line x1="112" y1="126" x2="224" y2="70" stroke="#4A2415" stroke-width="1.5" opacity="0.5"/>
  <line x1="112" y1="134" x2="224" y2="78" stroke="#4A2415" stroke-width="1.5" opacity="0.5"/>
  <line x1="112" y1="142" x2="224" y2="86" stroke="#4A2415" stroke-width="1.5" opacity="0.5"/>

  <!-- Roof left face -->
  <polygon points="0,56 70,14 70,22 0,64" fill="#5C3D1F"/>
  <!-- Roof right face -->
  <polygon points="70,14 224,56 224,64 70,22" fill="#3D2410"/>
  <!-- Roof ridge -->
  <polyline points="0,56 70,14 224,56" stroke="#7A5630" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- Door on left wall -->
  <rect x="30" y="90" width="28" height="40" fill="#3D2410" rx="1"/>
  <rect x="30" y="90" width="28" height="40" fill="none" stroke="#8B6640" stroke-width="1.5" rx="1"/>
  <line x1="44" y1="90" x2="44" y2="130" stroke="#7A5630" stroke-width="0.8"/>
  <circle cx="53" cy="110" r="2" fill="#B8A080"/>

  <!-- Window on right wall -->
  <rect x="152" y="78" width="24" height="18" fill="#A8D4E8" opacity="0.5" rx="1"/>
  <line x1="164" y1="78" x2="164" y2="96" stroke="#78909C" stroke-width="1"/>
  <line x1="152" y1="87" x2="176" y2="87" stroke="#78909C" stroke-width="1"/>
</svg>
