<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <!-- Top-down tree canopy (no fruit) -->

  <!-- Shadow -->
  <circle cx="47" cy="47" r="40" fill="#2A3E18" opacity="0.3"/>

  <!-- Main canopy -->
  <circle cx="45" cy="45" r="40" fill="#3E6020"/>

  <!-- Leaf clusters (6) -->
  <circle cx="33" cy="30" r="15" fill="#4A7028"/>
  <circle cx="56" cy="28" r="13" fill="#46682A"/>
  <circle cx="63" cy="50" r="14" fill="#4A7028"/>
  <circle cx="50" cy="64" r="13" fill="#426825"/>
  <circle cx="30" cy="58" r="14" fill="#466820"/>
  <circle cx="45" cy="42" r="10" fill="#507828" opacity="0.8"/>

  <!-- Canopy center shadow -->
  <circle cx="45" cy="45" r="18" fill="#2E4818" opacity="0.35"/>
</svg>
