<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 106">
  <!-- RAISED BED: 4x2, depth=10. Diamond: top=(96,0) R=(192,48) B=(96,96) L=(0,48) -->
  <!-- Corner radius ~9px along each edge -->

  <!-- Left wall (SW) - wood planks, follows rounded top face -->
  <path d="M 9,52 Q 0,48 9,44 L 9,54 Q 0,58 9,62 Z" fill="#7A5230"/>
  <polygon points="9,52 87,91 87,101 9,62" fill="#7A5230"/>
  <path d="M 87,91 Q 96,96 105,91 L 105,101 Q 96,106 87,101 Z" fill="#7A5230"/>

  <!-- Right wall (SE) - darker wood -->
  <path d="M 105,91 Q 96,96 87,91 L 87,101 Q 96,106 105,101 Z" fill="#5C3B1A"/>
  <polygon points="105,91 183,52 183,62 105,101" fill="#5C3B1A"/>
  <path d="M 183,52 Q 192,48 183,44 L 183,54 Q 192,58 183,62 Z" fill="#5C3B1A"/>

  <!-- Plank lines on left wall -->
  <line x1="9" y1="56" x2="87" y2="95" stroke="#5E3D22" stroke-width="1.5" opacity="0.5"/>
  <line x1="9" y1="59" x2="87" y2="98" stroke="#5E3D22" stroke-width="1.5" opacity="0.5"/>

  <!-- Plank lines on right wall -->
  <line x1="105" y1="95" x2="183" y2="56" stroke="#3F2510" stroke-width="1.5" opacity="0.5"/>
  <line x1="105" y1="98" x2="183" y2="59" stroke="#3F2510" stroke-width="1.5" opacity="0.5"/>

  <!-- Top face - dark soil with rounded corners -->
  <path d="M 87,5 Q 96,0 105,5 L 183,44 Q 192,48 183,52 L 105,91 Q 96,96 87,91 L 9,52 Q 0,48 9,44 Z" fill="#2C1A0E"/>

  <!-- Soil furrows -->
  <line x1="32" y1="32" x2="128" y2="80" stroke="#1A0F06" stroke-width="2" opacity="0.35"/>
  <line x1="64" y1="16" x2="160" y2="64" stroke="#1A0F06" stroke-width="2" opacity="0.35"/>

  <!-- Soil texture lumps -->
  <ellipse cx="60" cy="38" rx="5" ry="2" fill="#3D2B1A" opacity="0.5"/>
  <ellipse cx="96" cy="50" rx="6" ry="2.5" fill="#3D2B1A" opacity="0.4"/>
  <ellipse cx="130" cy="56" rx="5" ry="2" fill="#3D2B1A" opacity="0.5"/>
  <ellipse cx="80" cy="60" rx="4" ry="1.5" fill="#3D2B1A" opacity="0.4"/>

  <!-- Top rim highlight (rounded) -->
  <path d="M 9,44 Q 0,48 9,52" stroke="#A07A50" stroke-width="0" fill="none"/>
  <path d="M 87,5 Q 96,0 105,5 L 183,44 Q 192,48 183,52" stroke="#A07A50" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
