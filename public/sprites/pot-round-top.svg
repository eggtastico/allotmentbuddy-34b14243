<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Top-down view of a round terracotta pot -->

  <!-- Outer terracotta rim -->
  <circle cx="30" cy="30" r="29" fill="#B85C30"/>

  <!-- Inner wall (rim thickness) -->
  <circle cx="30" cy="30" r="22" fill="#8B3E18"/>

  <!-- Soil interior -->
  <circle cx="30" cy="30" r="20" fill="#3A2510"/>

  <!-- Soil texture dots -->
  <circle cx="22" cy="25" r="2" fill="#2A1A08" opacity="0.5"/>
  <circle cx="35" cy="32" r="1.5" fill="#2A1A08" opacity="0.5"/>
  <circle cx="28" cy="38" r="2" fill="#2A1A08" opacity="0.5"/>

  <!-- Rim highlight arc -->
  <path d="M 8,20 A 22,22 0 0 1 20,8" stroke="#D07840" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
