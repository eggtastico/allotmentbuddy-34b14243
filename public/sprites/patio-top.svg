<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
  <!-- Top-down concrete patio tile — smooth large slabs, 2×2 grid, seamless -->
  <!-- Concrete mortar background -->
  <rect width="48" height="48" fill="#9C9A98"/>

  <!-- Slab 1: top-left — cool light grey -->
  <rect x="2" y="2" width="20" height="20" fill="#CCCAC4"/>
  <!-- Subtle surface variation (lighter centre highlight) -->
  <rect x="3" y="3" width="18" height="3" fill="#D8D6D0" opacity="0.55"/>
  <!-- Very faint aggregate specks -->
  <circle cx="8"  cy="14" r="1"   fill="#AEACAA" opacity="0.4"/>
  <circle cx="16" cy="10" r="0.8" fill="#B4B2B0" opacity="0.35"/>

  <!-- Slab 2: top-right — slightly warmer -->
  <rect x="26" y="2" width="20" height="20" fill="#C8C6C0"/>
  <rect x="27" y="3" width="18" height="3" fill="#D4D2CC" opacity="0.55"/>
  <circle cx="34" cy="14" r="1"   fill="#AEACAA" opacity="0.4"/>
  <circle cx="40" cy="9"  r="0.8" fill="#B4B2B0" opacity="0.35"/>

  <!-- Slab 3: bottom-left -->
  <rect x="2" y="26" width="20" height="20" fill="#CACED0"/>
  <rect x="3" y="27" width="18" height="3" fill="#D6D4CE" opacity="0.55"/>
  <circle cx="10" cy="36" r="1"   fill="#AEACAA" opacity="0.4"/>
  <circle cx="18" cy="42" r="0.8" fill="#B4B2B0" opacity="0.35"/>

  <!-- Slab 4: bottom-right -->
  <rect x="26" y="26" width="20" height="20" fill="#C8C6C2"/>
  <rect x="27" y="27" width="18" height="3" fill="#D4D2CC" opacity="0.55"/>
  <circle cx="36" cy="38" r="1"   fill="#AEACAA" opacity="0.4"/>
  <circle cx="42" cy="44" r="0.8" fill="#B4B2B0" opacity="0.35"/>
</svg>
