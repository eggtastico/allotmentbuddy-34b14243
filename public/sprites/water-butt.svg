<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 52">
  <!-- WATER BUTT: 1x1, depth=20. Diamond: top=(32,0) R=(64,16) B=(32,32) L=(0,16) -->

  <!-- Left wall (SW) - barrel -->
  <polygon points="0,16 32,32 32,52 0,36" fill="#546E7A"/>

  <!-- Right wall (SE) - darker barrel -->
  <polygon points="32,32 64,16 64,36 32,52" fill="#37474F"/>

  <!-- Top face - barrel lid -->
  <polygon points="32,0 64,16 32,32 0,16" fill="#607D8B"/>

  <!-- Lid detail - inner ellipse -->
  <ellipse cx="32" cy="16" rx="18" ry="7" fill="#546E7A" opacity="0.5"/>
  <circle cx="32" cy="14" r="3" fill="#78909C"/>

  <!-- Barrel hoops -->
  <line x1="0" y1="24" x2="32" y2="40" stroke="#455A64" stroke-width="2" opacity="0.7"/>
  <line x1="32" y1="40" x2="64" y2="24" stroke="#37474F" stroke-width="2" opacity="0.7"/>

  <!-- Tap on front -->
  <rect x="28" y="42" width="3" height="4" fill="#795548"/>
  <circle cx="30" cy="47" r="2" fill="#6D4C41"/>

  <!-- Highlight edge -->
  <polyline points="0,16 32,0 64,16" stroke="#78909C" stroke-width="1.5" fill="none"/>
</svg>
