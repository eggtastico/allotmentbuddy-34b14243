<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Top-down wooden decking — horizontal boards, 48x48 seamless tile -->
  <!-- Dark gap background -->
  <rect width="48" height="48" fill="#3A2A18"/>

  <!-- Board 1: y=0 to y=10 (11px board, 1px gap before next) -->
  <rect x="0" y="0" width="48" height="10" fill="#B08858"/>
  <!-- Grain lines board 1 -->
  <line x1="0" y1="2" x2="48" y2="2.3" stroke="#8A6838" stroke-width="0.5" opacity="0.6"/>
  <line x1="0" y1="4.5" x2="48" y2="4.2" stroke="#8A6838" stroke-width="0.4" opacity="0.5"/>
  <line x1="0" y1="6.8" x2="48" y2="7.1" stroke="#8A6838" stroke-width="0.5" opacity="0.55"/>
  <line x1="0" y1="8.5" x2="48" y2="8.3" stroke="#8A6838" stroke-width="0.4" opacity="0.4"/>
  <!-- Knot on board 1 -->
  <circle cx="34" cy="5" r="1.5" fill="#7A5530" opacity="0.7"/>
  <circle cx="34" cy="5" r="0.8" fill="#5C3D20" opacity="0.6"/>

  <!-- Gap 1 -->
  <rect x="0" y="10" width="48" height="1.5" fill="#3A2A18"/>

  <!-- Board 2: y=11.5 to y=22 (10.5px board) — slightly lighter -->
  <rect x="0" y="11.5" width="48" height="10.5" fill="#BA9060"/>
  <!-- Grain lines board 2 -->
  <line x1="0" y1="13.5" x2="48" y2="13.8" stroke="#8A6838" stroke-width="0.5" opacity="0.55"/>
  <line x1="0" y1="15.8" x2="48" y2="15.5" stroke="#8A6838" stroke-width="0.4" opacity="0.5"/>
  <line x1="0" y1="18" x2="48" y2="18.3" stroke="#8A6838" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="20.2" x2="48" y2="20" stroke="#8A6838" stroke-width="0.4" opacity="0.45"/>

  <!-- Gap 2 -->
  <rect x="0" y="22" width="48" height="1.5" fill="#3A2A18"/>

  <!-- Board 3: y=23.5 to y=34 (10.5px board) — slightly darker -->
  <rect x="0" y="23.5" width="48" height="10.5" fill="#A47E50"/>
  <!-- Grain lines board 3 -->
  <line x1="0" y1="25.5" x2="48" y2="25.8" stroke="#8A6838" stroke-width="0.5" opacity="0.6"/>
  <line x1="0" y1="27.8" x2="48" y2="27.5" stroke="#8A6838" stroke-width="0.4" opacity="0.5"/>
  <line x1="0" y1="30" x2="48" y2="30.3" stroke="#8A6838" stroke-width="0.5" opacity="0.55"/>
  <line x1="0" y1="32.2" x2="48" y2="32" stroke="#8A6838" stroke-width="0.4" opacity="0.45"/>
  <!-- Knot on board 3 -->
  <circle cx="12" cy="28" r="1.3" fill="#7A5530" opacity="0.65"/>
  <circle cx="12" cy="28" r="0.6" fill="#5C3D20" opacity="0.55"/>

  <!-- Gap 3 -->
  <rect x="0" y="34" width="48" height="1.5" fill="#3A2A18"/>

  <!-- Board 4: y=35.5 to y=46 (10.5px board) — medium tone -->
  <rect x="0" y="35.5" width="48" height="10.5" fill="#B48A55"/>
  <!-- Grain lines board 4 -->
  <line x1="0" y1="37.5" x2="48" y2="37.8" stroke="#8A6838" stroke-width="0.5" opacity="0.55"/>
  <line x1="0" y1="39.8" x2="48" y2="39.5" stroke="#8A6838" stroke-width="0.4" opacity="0.5"/>
  <line x1="0" y1="42" x2="48" y2="42.3" stroke="#8A6838" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="44.2" x2="48" y2="44" stroke="#8A6838" stroke-width="0.4" opacity="0.45"/>
  <!-- Knot on board 4 -->
  <circle cx="40" cy="41" r="1.2" fill="#7A5530" opacity="0.6"/>
  <circle cx="40" cy="41" r="0.5" fill="#5C3D20" opacity="0.5"/>

  <!-- Gap 4 (at bottom edge - seamless with top of tile) -->
  <rect x="0" y="46" width="48" height="2" fill="#3A2A18"/>

  <!-- Additional subtle grain curves for realism -->
  <path d="M0 3.5 Q12 3.2 24 3.7 Q36 4.0 48 3.5" fill="none" stroke="#9A7848" stroke-width="0.3" opacity="0.4"/>
  <path d="M0 15 Q10 14.7 24 15.2 Q38 15.5 48 15" fill="none" stroke="#9A7848" stroke-width="0.3" opacity="0.35"/>
  <path d="M0 27 Q14 26.7 28 27.2 Q42 27.5 48 27" fill="none" stroke="#9A7848" stroke-width="0.3" opacity="0.4"/>
  <path d="M0 40 Q12 39.7 24 40.2 Q36 40.5 48 40" fill="none" stroke="#9A7848" stroke-width="0.3" opacity="0.35"/>

  <!-- Subtle board edge highlights (top of each board catches light) -->
  <rect x="0" y="0" width="48" height="0.5" fill="#D0A870" opacity="0.25"/>
  <rect x="0" y="11.5" width="48" height="0.5" fill="#D0A870" opacity="0.2"/>
  <rect x="0" y="23.5" width="48" height="0.5" fill="#D0A870" opacity="0.2"/>
  <rect x="0" y="35.5" width="48" height="0.5" fill="#D0A870" opacity="0.2"/>
</svg>
