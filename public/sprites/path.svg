<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84">
  <!-- PATH: 1x4, depth=4. Diamond: top=(80,0) R=(160,40) B=(80,80) L=(0,40) -->

  <!-- Left wall (SW) - shallow -->
  <polygon points="0,40 80,80 80,84 0,44" fill="#B0A080"/>

  <!-- Right wall (SE) - shallow -->
  <polygon points="80,80 160,40 160,44 80,84" fill="#998F6F"/>

  <!-- Top face - paving stones -->
  <polygon points="80,0 160,40 80,80 0,40" fill="#C8B89A"/>

  <!-- Stone joint lines -->
  <line x1="0" y1="40" x2="160" y2="40" stroke="#A89880" stroke-width="2" opacity="0.6"/>
  <line x1="40" y1="20" x2="120" y2="60" stroke="#A89880" stroke-width="1.5" opacity="0.4"/>
  <line x1="40" y1="60" x2="120" y2="20" stroke="#A89880" stroke-width="1.5" opacity="0.4"/>

  <!-- Gravel texture -->
  <circle cx="50" cy="30" r="1.5" fill="#8B7355" opacity="0.5"/>
  <circle cx="110" cy="35" r="1.2" fill="#8B7355" opacity="0.4"/>
  <circle cx="80" cy="50" r="1.3" fill="#9C8668" opacity="0.4"/>
  <circle cx="60" cy="55" r="1" fill="#8B7355" opacity="0.5"/>
  <circle cx="120" cy="55" r="1.2" fill="#8B7355" opacity="0.4"/>
  <circle cx="90" cy="25" r="1" fill="#9C8668" opacity="0.4"/>

  <!-- Edge highlight -->
  <polyline points="0,40 80,0 160,40" stroke="#D4C4A8" stroke-width="1.5" fill="none" opacity="0.6"/>
</svg>
