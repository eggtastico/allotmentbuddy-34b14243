  <line x1="26" y1="42" x2="26" y2="54" stroke="#689F38" stroke-width="0.7" opacity="0.4"/>
  <line x1="32" y1="42" x2="32" y2="54" stroke="#689F38" stroke-width="0.7" opacity="0.4"/>
  <line x1="38" y1="42" x2="38" y2="54" stroke="#689F38" stroke-width="0.7" opacity="0.4"/>
  <line x1="44" y1="44" x2="44" y2="52" stroke="#689F38" stroke-width="0.7" opacity="0.4"/>
  <!-- Highlight -->
