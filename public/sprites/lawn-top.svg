<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
  <!-- Top-down lawn tile — alternating mow stripes, 48×48, seamless repeat -->
  <!-- Base grass colour -->
  <rect width="48" height="48" fill="#5C8C2E"/>

  <!-- Alternating mow stripes (lighter/darker bands) -->
  <rect x="0" y="0"  width="48" height="12" fill="#68A034" opacity="0.45"/>
  <rect x="0" y="24" width="48" height="12" fill="#68A034" opacity="0.45"/>

  <!-- Subtle grass-blade texture (short diagonal lines within each stripe) -->
  <!-- Light stripe 1 blades -->
  <line x1="4"  y1="2"  x2="3"  y2="6"  stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <line x1="10" y1="1"  x2="9"  y2="5"  stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="3"  x2="15" y2="7"  stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <line x1="22" y1="1"  x2="21" y2="5"  stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <line x1="28" y1="3"  x2="27" y2="7"  stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <line x1="34" y1="2"  x2="33" y2="6"  stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <line x1="40" y1="1"  x2="39" y2="5"  stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <line x1="46" y1="3"  x2="45" y2="7"  stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <!-- Dark stripe 1 blades -->
  <line x1="4"  y1="14" x2="5"  y2="18" stroke="#487A20" stroke-width="0.8" opacity="0.4"/>
  <line x1="12" y1="13" x2="13" y2="17" stroke="#487A20" stroke-width="0.8" opacity="0.4"/>
  <line x1="20" y1="15" x2="21" y2="19" stroke="#487A20" stroke-width="0.8" opacity="0.4"/>
  <line x1="28" y1="13" x2="29" y2="17" stroke="#487A20" stroke-width="0.8" opacity="0.4"/>
  <line x1="36" y1="14" x2="37" y2="18" stroke="#487A20" stroke-width="0.8" opacity="0.4"/>
  <line x1="44" y1="13" x2="45" y2="17" stroke="#487A20" stroke-width="0.8" opacity="0.4"/>
  <!-- Light stripe 2 blades -->
  <line x1="6"  y1="26" x2="5"  y2="30" stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <line x1="14" y1="25" x2="13" y2="29" stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <line x1="22" y1="27" x2="21" y2="31" stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <line x1="30" y1="25" x2="29" y2="29" stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <line x1="38" y1="26" x2="37" y2="30" stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <line x1="46" y1="25" x2="45" y2="29" stroke="#7AB040" stroke-width="0.8" opacity="0.5"/>
  <!-- Dark stripe 2 blades -->
  <line x1="4"  y1="38" x2="5"  y2="42" stroke="#487A20" stroke-width="0.8" opacity="0.4"/>
  <line x1="12" y1="37" x2="13" y2="41" stroke="#487A20" stroke-width="0.8" opacity="0.4"/>
  <line x1="20" y1="39" x2="21" y2="43" stroke="#487A20" stroke-width="0.8" opacity="0.4"/>
  <line x1="28" y1="37" x2="29" y2="41" stroke="#487A20" stroke-width="0.8" opacity="0.4"/>
  <line x1="36" y1="38" x2="37" y2="42" stroke="#487A20" stroke-width="0.8" opacity="0.4"/>
  <line x1="44" y1="37" x2="45" y2="41" stroke="#487A20" stroke-width="0.8" opacity="0.4"/>
</svg>
