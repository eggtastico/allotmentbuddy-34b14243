<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
  <!-- Top-down stepping stone tile — one rough slab per tile, dark ground surround -->
  <!-- Dark mossy ground -->
  <rect width="48" height="48" fill="#2E3A1A"/>

  <!-- Rough stone slab (slightly irregular ellipse) -->
  <ellipse cx="24" cy="24" rx="20" ry="19" fill="#A8A898"/>
  <!-- Top-left light face -->
  <ellipse cx="18" cy="17" rx="14" ry="10" fill="#BCBCAC" opacity="0.55"/>
  <!-- Natural stone texture cracks/marks -->
  <line x1="14" y1="22" x2="28" y2="19" stroke="#8A8A7A" stroke-width="1"   opacity="0.4"/>
  <line x1="16" y1="28" x2="32" y2="26" stroke="#8A8A7A" stroke-width="0.8" opacity="0.35"/>
  <line x1="20" y1="32" x2="30" y2="34" stroke="#8A8A7A" stroke-width="0.8" opacity="0.3"/>
  <line x1="26" y1="16" x2="34" y2="20" stroke="#8A8A7A" stroke-width="0.8" opacity="0.3"/>
  <!-- Shadow (bottom-right) -->
  <ellipse cx="29" cy="31" rx="12" ry="8" fill="#707068" opacity="0.3"/>
  <!-- Lichen fleck -->
  <circle cx="18" cy="28" r="1.5" fill="#6A8040" opacity="0.5"/>
  <circle cx="30" cy="18" r="1"   fill="#6A7830" opacity="0.4"/>
</svg>
