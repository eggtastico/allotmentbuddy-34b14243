<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Polytunnel top-down: translucent green polythene only -->
  <!-- All structural lines (hoops) come from the GardenGrid SVG overlay -->

  <!-- Base translucent green plastic sheeting -->
  <rect width="48" height="48" fill="rgba(220,240,220,0.45)"/>

  <!-- Subtle milky polythene gradient -->
  <defs>
    <linearGradient id="plastic-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="50%" stop-color="rgba(200,230,200,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.10)"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" fill="url(#plastic-sheen)"/>

